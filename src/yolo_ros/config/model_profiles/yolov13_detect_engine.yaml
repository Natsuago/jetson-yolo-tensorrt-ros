model:
  family: yolov13
  version: "13"
  task: detect
  backend: engine
  path: /home/bdi/models/yolov13n_fp16.engine
  imgsz: 640
  class_names: coco
  meta: /home/bdi/models/yolov13n_fp16.engine.meta.yaml
  status: experimental
  note: "Experimental third-party YOLOv13 provider. Prefer iMoonLab/yolov13 ultralytics-style runtime and verify compatibility."

inference:
  conf: 0.25
  iou: 0.45
  classes: []
  max_det: 300

engine:
  accelerator: gpu
  dla_core: null
  precision: fp16
  allow_gpu_fallback: false
  nms: false
  end2end: null

external:
  yolov5_repo: ""

ros:
  image_topic: /camera/color/image_raw
  camera_info_topic: /camera/color/camera_info
  detections_topic: /yolo/detections
  overlay_topic: /yolo/overlay
  publish_overlay: true
  queue_size: 1
