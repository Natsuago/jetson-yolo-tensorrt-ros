model:
  family: ultralytics
  version: "26"
  task: detect
  backend: engine
  path: /home/bdi/models/yolo26n_dla0_fp16.engine
  imgsz: 640
  class_names: coco
  meta: /home/bdi/models/yolo26n_dla0_fp16.engine.meta.yaml
  status: stable
  note: "DLA0 TensorRT FP16 engine profile. Orin NX 8GB exposes only DLA core 0; Orin NX 16GB can use DLA core 0 or 1. YOLO26 end-to-end / NMS-free behavior requires output schema verification."

inference:
  conf: 0.25
  iou: 0.45
  classes: []
  max_det: 300

engine:
  accelerator: dla
  dla_core: 0
  precision: fp16
  allow_gpu_fallback: true
  nms: false
  end2end: null

external:
  yolov5_repo: ""

ros:
  image_topic: /camera/color/image_raw
  camera_info_topic: /camera/color/camera_info
  detections_topic: /yolo/detections
  overlay_topic: /yolo/overlay
  publish_overlay: true
  queue_size: 1

