export:
  tool: tools/export/export_ultralytics.py
  format: engine
  precision: fp16
  accelerator: dla
  dla_core: 0
  allow_gpu_fallback: true
  imgsz: 640
  batch: 1
  dynamic: false
  workspace_gib: 4
  simplify: false
  nms: false
  end2end: none
  device: 0

inference:
  conf: 0.25
  iou: 0.45
  classes: []
  max_det: 300

runtime:
  expected_runner: ultralytics_runner
  note: "DLA0 FP16 export target. Orin NX 8GB exposes only DLA core 0; DLA may use GPU fallback for unsupported layers."

